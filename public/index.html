<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso Rápido</title>

<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

<link rel="stylesheet" href="/styles.css?v=16">

<script>
  // aplica o tema salvo antes de renderizar, para nao "piscar"
  (function () {
    const saved = localStorage.getItem('acesso-rapido-theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
</head>
<body>
  <div class="network-bg" id="networkBg"></div>
  <div class="ambient-glow"></div>

  <header class="hero-banner">
    <div class="hero-top">
      <div class="brand">
        <img src="/assets/logo.png" alt="Acesso Rápido">
        <span class="brand-name">Acesso Rápido</span>
        <div class="topbar-clock">
          <span class="clock-time" id="clockTime">--:--:--</span>
          <span class="clock-date" id="clockDate"></span>
        </div>
      </div>
      <div class="topbar-actions">
        <a href="/ti.html" class="icon-btn" title="Área de TI" aria-label="Área de TI">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
        </a>
        <button class="icon-btn" id="adminBtn" title="Painel admin" aria-label="Painel admin">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <button class="theme-toggle" id="themeToggle" title="Alternar tema" aria-label="Alternar tema">
          <span class="knob">
            <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </span>
        </button>
      </div>
    </div>

    <div class="hero-greeting">
      <h1 id="greetingText">Olá, colaborador!</h1>
      <p id="greetingDate"></p>
    </div>

    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="searchInput" placeholder="Digite sua busca... (atalho: /)">
    </div>
  </header>

  <div class="alerts-container" id="alertsContainer"></div>

  <main>
    <div class="tile-grid" id="tileGrid">
      <!-- tiles inseridos via JS -->
    </div>

    <div class="pagination" id="pagination" style="display:none;">
      <button class="page-arrow" id="prevPage" aria-label="Página anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <div class="page-dots" id="pageDots"></div>
      <button class="page-arrow" id="nextPage" aria-label="Próxima página">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>

    <!-- ---------- ATALHOS DA AREA DE TI (visiveis para quem tem acesso) ---------- -->
    <div class="ti-home-section" id="tiTilesSection" style="display:none;">
      <div class="ti-col-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
        <h2>Atalhos de TI</h2>
        <a href="/ti.html" class="btn btn-secondary" style="width:auto; padding:4px 12px; font-size:0.75rem; margin-left:auto;">Área de TI</a>
      </div>
      <div class="mini-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="homeTiTileSearchInput" placeholder="Buscar atalho de TI...">
      </div>
      <div class="tile-grid" id="homeTiTileGrid"></div>
    </div>
  </main>

  <script src="/network-bg.js?v=15"></script>
  <script src="/trim-image.js?v=15"></script>
  <script src="/app.js?v=17"></script>
</body>
</html>
