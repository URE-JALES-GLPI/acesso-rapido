<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área de TI — Acesso Rápido</title>

<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

<link rel="stylesheet" href="/styles.css?v=14">
<script>
  (function () {
    const saved = localStorage.getItem('acesso-rapido-theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
</head>
<body>
<div class="network-bg" id="networkBg"></div>
<div class="ambient-glow"></div>

<!-- ===================== TELA DE LOGIN ===================== -->
<div class="auth-wrap" id="loginScreen" style="display:none;">
  <div class="auth-card">
    <div class="brand">
      <img class="logo-dark" src="/assets/logo.png" alt="Acesso Rápido" style="height:36px;">
      <img class="logo-light" src="/assets/logo-light.png" alt="Acesso Rápido" style="height:36px;">
    </div>
    <h1>Entrar na área de TI</h1>
    <div class="error-msg" id="loginError"></div>
    <form id="loginForm">
      <div class="field">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
    <a href="/" class="btn btn-secondary" style="width:100%; margin-top:10px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Voltar para o início
    </a>
  </div>
</div>

<!-- ===================== AREA LOGADA ===================== -->
<div id="tiScreen" style="display:none;">
  <header class="topbar">
    <div class="brand">
      <img class="logo-dark" src="/assets/logo.png" alt="Acesso Rápido">
      <img class="logo-light" src="/assets/logo-light.png" alt="Acesso Rápido">
      <span class="brand-name">Área de TI</span>
    </div>
    <div class="topbar-actions">
      <a href="/" class="icon-btn" title="Ver site" aria-label="Ver site">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </a>
      <button class="icon-btn" id="manageToggleBtn" title="Configurar atalhos e anotações" aria-label="Configurar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
      <button class="theme-toggle" id="themeToggle" title="Alternar tema" aria-label="Alternar tema">
        <span class="knob">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </span>
      </button>
      <button class="icon-btn" id="logoutBtn" title="Sair" aria-label="Sair">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      </button>
    </div>
  </header>

  <div class="ti-split" id="tiSplit">
    <!-- ---------- COLUNA: ATALHOS ---------- -->
    <div class="ti-col">
      <div class="ti-col-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <h2>Atalhos</h2>
      </div>

      <div class="tile-grid" id="tiTileGrid"></div>

      <div class="panel-card manage-only">
        <h2 id="tiTileFormTitle">Adicionar novo site</h2>
        <div class="success-msg" id="tiTileFormSuccess"></div>
        <div class="error-msg" id="tiTileFormError"></div>
        <form id="tiTileForm">
          <input type="hidden" id="tiTileId" value="">
          <div class="form-grid">
            <div class="field">
              <label for="tiTitle">Título</label>
              <input type="text" id="tiTitle" placeholder="Ex: Proxmox" required>
            </div>
            <div class="field">
              <label for="tiUrl">Link (URL)</label>
              <input type="text" id="tiUrl" placeholder="https://meusite.com" required>
            </div>
            <div class="field full">
              <label>Imagem (opcional)</label>
              <div class="image-input-row">
                <div class="image-preview" id="tiImagePreview">—</div>
                <label class="file-label">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                  Enviar imagem
                  <input type="file" id="tiImageFile" accept="image/png,image/jpeg,image/webp,image/svg+xml,image/gif">
                </label>
                <button type="button" class="btn btn-secondary" id="tiRemoveImageBtn" style="display:none;">Remover imagem</button>
              </div>
            </div>
          </div>
          <div style="display:flex; gap:10px; margin-top:6px;">
            <button type="submit" class="btn btn-primary" style="width:auto; padding-left:24px; padding-right:24px;">Salvar</button>
            <button type="button" class="btn btn-secondary" id="tiCancelEditBtn" style="display:none;">Cancelar edição</button>
          </div>
        </form>
      </div>

      <div class="panel-card manage-only">
        <h2>Sites cadastrados</h2>
        <div class="tile-list" id="tiTileList"></div>
      </div>

      <div class="panel-card manage-only">
        <h2>Mais acessados</h2>
        <div class="tile-list" id="tiRankingList"></div>
      </div>

      <div class="panel-card manage-only">
        <h2>Histórico de cliques</h2>
        <div class="scroll-list" id="tiClicksHistoryList"></div>
      </div>
    </div>

    <!-- ---------- COLUNA: ANOTACOES ---------- -->
    <div class="ti-col">
      <div class="ti-col-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        <h2>Anotações</h2>
      </div>

      <div class="panel-card manage-only">
        <h2 id="noteFormTitle">Nova anotação</h2>
        <div class="success-msg" id="noteFormSuccess"></div>
        <div class="error-msg" id="noteFormError"></div>
        <form id="noteForm">
          <input type="hidden" id="noteId" value="">
          <div class="field">
            <label for="noteTitle">Título (opcional)</label>
            <input type="text" id="noteTitle" placeholder="Ex: Configuração do switch da sala 3">
          </div>
          <div class="field">
            <label for="noteContent">Anotação</label>
            <textarea id="noteContent" rows="6" placeholder="Escreva aqui..."></textarea>
          </div>
          <div class="field">
            <label>Anexos (opcional)</label>
            <label class="file-label">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
              Anexar arquivos (imagens, vídeos, documentos...)
              <input type="file" id="noteFiles" multiple>
            </label>
            <div class="hint" id="notePendingFiles"></div>
            <div class="attachment-grid" id="existingAttachments"></div>
          </div>
          <div class="field">
            <label>Quem pode ver esta anotação?</label>
            <div id="noteGroupsChecklist" class="checklist"></div>
            <div class="hint">Se não marcar nenhum grupo, todo mundo com acesso à área de TI poderá ver.</div>
          </div>
          <div style="display:flex; gap:10px; margin-top:10px;">
            <button type="submit" class="btn btn-primary" style="width:auto; padding-left:24px; padding-right:24px;">Salvar anotação</button>
            <button type="button" class="btn btn-secondary" id="noteCancelEditBtn" style="display:none;">Cancelar edição</button>
          </div>
        </form>
      </div>

      <div id="notesList"></div>
    </div>
  </div>
</div>

<script src="/network-bg.js?v=13"></script>
<script src="/ti.js?v=13"></script>
</body>
</html>
